name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: librenms+grafana/requirements-dev.txt
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r librenms+grafana/requirements-dev.txt
      - name: Install Nginx for HTTP routing regression
        run: sudo apt-get update && sudo apt-get install -y nginx-light
      - name: Run pytest
        run: pytest -q

  python-syntax:
    name: Python syntax (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall -q -f librenms+grafana

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Shell scripts
        # D-04: warnings are now blocking after the current warning inventory
        # is cleaned. Keep this gate at warning severity going forward.
        run: >-
          find librenms+grafana -type f -name '*.sh' -print0
          | xargs -0 shellcheck --severity=warning

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with their declared shell
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find librenms+grafana -type f -name '*.sh' -print0)

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: >-
          find librenms+grafana -type f -name '*.js' -print0
          | xargs -0 -n1 node --check
      - name: Run big screen JavaScript tests
        run: |
          for file in librenms+grafana/tests/test_bigscreen_*.js; do
            echo "--- $file ---"
            node "$file"
          done

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: librenms+grafana
        run: |
          cp .env.example .env
          cp event-config.example.yml event-config.yml
          trap 'rm -f .env event-config.yml' EXIT
          docker compose config --quiet
      - name: Verify Bigscreen host port publication
        working-directory: librenms+grafana
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp event-config.example.yml event-config.yml
          project="bigscreen-bind-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -p "$project" down -v
            rm -f .env event-config.yml
          }
          trap cleanup EXIT
          export BIGSCREEN_PORT=18088
          for ip in "" 127.0.0.2; do
            BIGSCREEN_BIND_IP="$ip" docker compose -p "$project" config --format json |
              python3 -c 'import json, sys
          ports = json.load(sys.stdin)["services"]["bigscreen"]["ports"]
          assert len(ports) == 1, ports
          port = ports[0]
          assert (port.get("host_ip", ""), str(port["published"]), port["target"]) == (sys.argv[1], "18088", 80), ports
          ' "$ip"
          done
          if BIGSCREEN_BIND_IP=999.42.0.1 docker compose -p "$project" config --quiet >/dev/null 2>&1; then
            echo "Compose accepted an invalid Bigscreen host IP" >&2
            exit 1
          fi
          export BIGSCREEN_BIND_IP=127.0.0.2
          docker compose -p "$project" up -d --no-deps bigscreen
          test "$(docker compose -p "$project" port bigscreen 80)" = "127.0.0.2:18088"
          curl -fsS --noproxy '*' --retry 10 --retry-connrefused --max-time 2 --retry-max-time 15 http://127.0.0.2:18088/ >/dev/null
          if curl -fsS --noproxy '*' --max-time 2 http://127.0.0.1:18088/ >/dev/null 2>&1; then
            echo "Bigscreen also answered on the unconfigured IPv4 address" >&2
            exit 1
          fi
      - name: Isolated topology-collector import smoke
        working-directory: librenms+grafana
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp event-config.example.yml event-config.yml
          project="p0-ap-placement-import-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          cleanup() {
            docker compose -p "$project" down -v --remove-orphans
            cleanup_status=$?
            rm -f .env event-config.yml
            remaining_containers="$(docker ps -aq --filter "label=com.docker.compose.project=$project")"
            remaining_volumes="$(docker volume ls -q --filter "label=com.docker.compose.project=$project")"
            remaining_networks="$(docker network ls -q --filter "label=com.docker.compose.project=$project")"
            printf 'cleanup exit=%s remaining_containers=%s remaining_volumes=%s remaining_networks=%s\n' \
              "$cleanup_status" "$remaining_containers" "$remaining_volumes" "$remaining_networks"
            if [ "$cleanup_status" -ne 0 ] || [ -n "$remaining_containers$remaining_volumes$remaining_networks" ]; then
              echo "isolated smoke cleanup failed"
              exit 1
            fi
          }
          trap cleanup EXIT
          docker compose -p "$project" build topology-collector
          docker compose -p "$project" run --rm --no-deps \
            --entrypoint python3 topology-collector \
            -c 'import runpy; runpy.run_path("/generate-topology-edges.py", run_name="topology_import_only"); print("topology-collector import-only smoke: PASS")'

  linux-smoke:
    name: Linux static smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run non-invasive Linux smoke test
        run: bash librenms+grafana/scripts/smoke-test.sh --static

  dashboards-json:
    name: Dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate every dashboard JSON
        run: |
          python - <<'PY'
          import glob
          import json

          failures = []
          for path in glob.glob("librenms+grafana/grafana-provisioning/dashboard-json/*.json"):
              try:
                  with open(path, encoding="utf-8-sig") as handle:
                      json.load(handle)
                  print(f"OK  {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  print(f"FAIL {path}: {exc}")

          raise SystemExit(1 if failures else 0)
          PY

  ping-domain-browser:
    name: Ping domain browser and isolated services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: librenms+grafana/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Try installing CJK screenshot fonts
        shell: bash
        run: |
          if ! timeout --kill-after=5s 60s bash -c '
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq &&
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y --no-install-recommends fonts-noto-cjk
          '; then
            echo "::warning::CJK screenshot fonts unavailable, using runner fonts"
          fi
      - name: Prepare isolated browser dependencies
        run: |
          pip install --disable-pip-version-check -r librenms+grafana/requirements-dev.txt
          npm install --prefix "$RUNNER_TEMP/ping-browser" --no-audit --no-fund --no-save playwright@1.56.1
      - name: Verify D3 layouts in Chromium
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ping-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export PING_BROWSER_OUTPUT="$RUNNER_TEMP/ping-browser-evidence/domains"
          mkdir -p "$PING_BROWSER_OUTPUT"
          node librenms+grafana/tests/chromium_ping_domains.js | tee "$PING_BROWSER_OUTPUT/layout-run.log"
      - name: Compare infrastructure overview layouts in Chromium
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ping-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export INFRA_BASE_REF=HEAD^1
          export INFRA_BROWSER_OUTPUT="$RUNNER_TEMP/ping-browser-evidence/infra"
          mkdir -p "$INFRA_BROWSER_OUTPUT"
          node librenms+grafana/tests/chromium_infra_overview.js | tee "$INFRA_BROWSER_OUTPUT/run.log"
      - name: Exercise B/C browser with Platform API and real Prometheus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ping-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export INFRA_BROWSER_OUTPUT="$RUNNER_TEMP/ping-browser-evidence/traffic-bc"
          export RUN_TRAFFIC_BC_BROWSER=1
          mkdir -p "$INFRA_BROWSER_OUTPUT"
          pytest -q -s librenms+grafana/tests/test_traffic_bc_browser.py | tee "$INFRA_BROWSER_OUTPUT/run.log"
      - name: Exercise browser with Platform API, DNS, Prometheus and Blackbox
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ping-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export PING_BROWSER_OUTPUT="$RUNNER_TEMP/ping-browser-evidence/domains"
          export RUN_CUSTOM_PING_DOMAIN_BROWSER=1
          mkdir -p "$PING_BROWSER_OUTPUT"
          pytest -q -s librenms+grafana/tests/test_custom_ping_dns.py::test_dns_real_prometheus_blackbox_generation_and_history | tee "$PING_BROWSER_OUTPUT/isolated-pytest.log"
      - name: Verify legacy Ping in Chromium
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ping-browser/node_modules/playwright"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_PATH"
          export PING_BROWSER_OUTPUT="$RUNNER_TEMP/ping-browser-evidence/legacy"
          mkdir -p "$PING_BROWSER_OUTPUT"
          node librenms+grafana/tests/chromium_ping_custom.js | tee "$PING_BROWSER_OUTPUT/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ping-d3-browser-evidence
          path: ${{ runner.temp }}/ping-browser-evidence
          if-no-files-found: error
