name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: librenms+grafana/requirements-dev.txt
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r librenms+grafana/requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  python-syntax:
    name: Python syntax (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall -q -f librenms+grafana

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Shell scripts
        # Keep existing warnings non-blocking; parsing and other definite
        # errors still fail the job.
        run: >-
          find librenms+grafana -type f -name '*.sh' -print0
          | xargs -0 shellcheck --severity=error

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with their declared shell
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find librenms+grafana -type f -name '*.sh' -print0)

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: >-
          find librenms+grafana -type f -name '*.js' -print0
          | xargs -0 -n1 node --check
      - name: Run big screen JavaScript tests
        run: |
          for file in librenms+grafana/tests/test_bigscreen_*.js; do
            echo "--- $file ---"
            node "$file"
          done

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: librenms+grafana
        run: |
          cp .env.example .env
          cp event-config.example.yml event-config.yml
          trap 'rm -f .env event-config.yml' EXIT
          docker compose config --quiet

  linux-smoke:
    name: Linux static smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run non-invasive Linux smoke test
        run: bash librenms+grafana/scripts/smoke-test.sh --static

  dashboards-json:
    name: Dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate every dashboard JSON
        run: |
          python - <<'PY'
          import glob
          import json

          failures = []
          for path in glob.glob("librenms+grafana/grafana-provisioning/dashboard-json/*.json"):
              try:
                  with open(path, encoding="utf-8-sig") as handle:
                      json.load(handle)
                  print(f"OK  {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  print(f"FAIL {path}: {exc}")

          raise SystemExit(1 if failures else 0)
          PY
