schema_version: 1

event:
  name:
  default_layout: tournament-64-2layer
  team_orders: {}

networks:
  player_vlan: 40
  wireless_vlan: 41
  player_subnets: 192.168.40.0/24
  wireless_subnets: 192.168.41.0/24
  player_gateways:
  switch_management_ranges: 192.168.10.1-100,192.168.10.254
  firewall_management_ranges: 192.168.9.0/24

snmp:
  community: global

topology:
  # hybrid: LibreNMS 优先并按设备/数据部分回退 SNMP。
  # librenms: 只读 LibreNMS，用于诊断；direct-snmp: 完全使用旧采集路径。
  data_source: hybrid
  poll_max_age_seconds: 600
  discovery_max_age_seconds: 28800

devices:
  core:
    ip:
  firewall:
    ip:
    name:
    snmp:
    unit_snmp:
  # Only switches carrying tournament PCs belong here. Other access switches
  # are discovered from networks.switch_management_ranges and stay out of the
  # tournament/player console.
  # stage_switches:
  #   - name: PGS-stage-1
  #     ip: 192.168.10.45
  #   - name: PGS-stage-2
  #     ip: 192.168.10.46
  stage_switches: []
  access_switches: []
  servers: []

isp:
  auto_discovery: true
  wan_if_filter: telecom,telcom,unicom,isp,WAN
  max_bandwidth_mbps:
  links: []

unifi:
  enabled: false
  controller_url:
  user:
  password:
  sites: all
  verify_ssl: false

alerts:
  feishu_robot_token:
  feishu_app_id:
  feishu_app_secret:
  feishu_chat_id:
  syslog_alert_types: native_vlan_mismatch,mac_flap,errdisable,bpduguard,loopback
  # 网关、防火墙或 HSRP/VRRP 虚拟 MAC；多个值用逗号分隔。
  gateway_macs:
  # 上述 MAC 正常应出现的 Port-channel；多个值用逗号分隔。
  gateway_uplink_ports:
  mac_flap_window_seconds: 60
  mac_flap_threshold: 3
  cpu_alert_percent: 70
  memory_alert_percent: 80

security:
  grafana_anonymous: true
