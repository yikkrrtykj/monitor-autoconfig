auths:
  global:
    version: 2
    community: ${SNMP_COMMUNITY}

modules:
  if_mib:
    walk:
      - ifTable
      - ifXTable
      # ifStackTable is intentionally not here. Core interconnect monitoring
      # requests the dedicated if_stack module, otherwise the same table is
      # walked twice and every firewall interface scrape also pays for it.
    max_repetitions: 25
    # Monitoring repeats automatically; retrying inside one scrape creates
    # overlapping SNMP work on a slow management plane.
    retries: 0
    timeout: 2s
